[package]
name = "blue-dove"
version = "0.1.2"
edition = "2024"
description = "A fast music player with an album browser and waveform seekbar"
license = "MIT"
repository = "https://github.com/pkgforge-apps/blue-dove"
homepage = "https://pkgforge-apps.github.io/blue-dove/"
readme = "README.md"
publish = false
exclude = ["/docs", "/scripts", "/.github", "/.agents", "/.claude"]

[dependencies]
ape-decoder = "0.3.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
lofty = "0.25.4"
ogg = "0.9.2"
opus-rs = "0.1.40"
oxideav-musepack = "0.0.4"
oxideav-shorten = "0.0.4"
oxideav-tta = "0.0.4"
png = "0.18.1"
resvg = { version = "0.49.0", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
rodio = { version = "0.23.0", default-features = false, features = ["flac", "mp3", "mp4", "playback", "symphonia-adpcm", "symphonia-aiff", "symphonia-alac", "symphonia-caf", "symphonia-mkv", "symphonia-mp1", "symphonia-mp2", "vorbis", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
walkdir = "2.5.0"
wavicle = "0.1.0"
zbus = "5"
zune-jpeg = "0.5.15"

[build-dependencies]
winresource = "0.1.34"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

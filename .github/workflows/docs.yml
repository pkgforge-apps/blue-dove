name: docs

# Copied from pkgforge-apps/.github by scripts/sync-guidelines.sh, which
# also pins the shared workflow below to the revision it synced from.
on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  docs:
    uses: pkgforge-apps/.github/.github/workflows/app-docs.yml@6b3bcf9fe1016b4cbd702c3bbc0968c72c63288e
    permissions:
      contents: read
      pages: write
      id-token: write

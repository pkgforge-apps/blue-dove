name: appimage

# Anylinux AppImage, built after the release workflow finishes.
#
# The shared release workflow builds none for this app: its job installs
# neither the audio servers nor the ALSA packages quick-sharun bundles
# for them, and it has no way to pass DEPLOY_PIPEWIRE or DEPLOY_PULSE.
# The images are attached here instead, to the release it published.
#
# The trigger is the release workflow's completion, not `release:
# published`: a release published with GITHUB_TOKEN starts no workflow, so
# the release event never fires.
#
# This only covers a release workflow started by a person. release-plz
# dispatches it with GITHUB_TOKEN, and GitHub starts no workflow for an
# event a GITHUB_TOKEN produced, the completion included, so that path
# publishes a release with no image. `.github/workflows/release.yml` is a
# synced copy of the shared one and cannot carry a second job, so until
# the shared workflow builds the image itself, a release cut by release-plz
# needs this workflow dispatched by hand with its tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the images to; empty takes the latest
        required: false
        type: string
        default: ""
  workflow_run:
    workflows: [release]
    types: [completed]

concurrency:
  group: appimage-${{ github.event.workflow_run.head_branch || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest@sha256:782f92dd4cd2adee5544ec7fc53d06a9168489041fae13271b418123c858d5e7
    permissions:
      # Attaching the images to the published release is a write.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both pinned: the image carries the container's glibc and
          # loader, so a runner image bump must be a deliberate change.
          - { runs-on: ubuntu-24.04, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      # A manual run may name any release; the automatic one takes the
      # latest, which is the one the release workflow just published.
      # Resolved over HTTP rather than with gh: this runs before the
      # container has it.
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          tag=${TAG:-}
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" |
              sed -n 's/^ *"tag_name": *"\([^"]*\)".*/\1/p')
          fi
          if [ -z "$tag" ]; then
            echo "no release to attach to" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      # The setup action leaves the toolchain out, and the audio packages
      # this app needs are not in it either; the script installs both, and
      # retries each pacman transaction.
      - run: sh packaging/appimage/get-dependencies.sh
      # Arch's Mesa is far larger than the debloated build, and this is
      # what users download.
      - run: get-debloated-pkgs --add-common --prefer-nano
      - run: rustup default stable
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo build --release --locked
      # The name says what the file is: an Anylinux AppImage for this
      # architecture, not a build tied to one distribution.
      - run: sh scripts/package-appimage.sh "anylinux-${{ matrix.arch }}" "${{ steps.version.outputs.version }}"
        env:
          # cpal plays through libasound, which loads the sound server's
          # plugin by name, so nothing links libpulse and quick-sharun
          # cannot detect it. The pulse plugin is the one the image's
          # default PCM resolves to: it covers a PulseAudio host and a
          # PipeWire one running pipewire-pulse, which is the usual
          # desktop setup. Deploying pipewire as well adds its client
          # library and SPA plugins, and no config ever selects them,
          # since 99-pulseaudio-default.conf sorts after the pipewire one.
          DEPLOY_PULSE: 1
      # A host with Mesa covers for an image without one, so only a run
      # here says the image carries what it needs.
      - name: Smoke run the AppImage
        run: xvfb-run -a timeout 60 dist/*.AppImage --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppImage-${{ matrix.arch }}
          # The trailing * keeps the .zsync, which the release needs too.
          path: dist/*.AppImage*
          if-no-files-found: error
      - name: Attach the images to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.AppImage dist/*.AppImage.zsync \
            --clobber --repo "$GITHUB_REPOSITORY"
